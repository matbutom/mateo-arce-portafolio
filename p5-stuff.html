<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff" />
    <title>mateoArce_mam</title>
    <link rel="stylesheet" href="https://use.typekit.net/lhe1ara.css" />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/pixel-asterisk-favicon.png" />
    <style>
      :root { --pink:#ff72ef; --ink:#111; --line:#d5d5d5; }
      * { box-sizing:border-box; }
      body.p5-gallery-page { margin:0; min-height:100vh; overflow-x:hidden; background:#fff; color:var(--ink); font-family:"early-sans-variable","early-sans",Arial,sans-serif; }
      .gallery-view { min-height:100vh; padding:14px 18px 12px; display:flex; flex-direction:column; }
      .gallery-view[hidden] { display:none; }
      .gallery-grid { --cols:6; --gap:22px; width:100%; max-width:1040px; margin:0 auto; padding:6vh 0; flex:1; display:flex; flex-wrap:wrap; justify-content:center; align-content:center; gap:var(--gap); }
      .gallery-card { flex:0 0 calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols)); min-width:0; min-height:0; display:flex; flex-direction:column; padding:0; border:0; background:#fff; color:inherit; text-align:left; text-decoration:none; cursor:pointer; outline:none; }
      .gallery-preview { position:relative; display:block; flex:initial; width:100%; aspect-ratio:1/1; min-height:0; overflow:hidden; border:1px solid var(--ink); background:#f3f3f3; transition:border-color .18s,background .18s; }
      .gallery-card:hover .gallery-preview,.gallery-card:focus-visible .gallery-preview { border:2px solid var(--pink); background:#fff5fd; }
      .gallery-preview img { position:absolute; inset:0; display:block; width:100%; height:100%; object-fit:contain; opacity:0; transition:opacity .25s; }
      .gallery-preview.is-loaded { background:#fff; }
      .gallery-preview.is-loaded img { opacity:1; }
      .preview-placeholder { position:absolute; inset:0; display:grid; place-items:center; color:#888; font-size:.72rem; letter-spacing:.08em; }
      .gallery-preview.is-loaded .preview-placeholder { display:none; }
      .gallery-name { display:flex; justify-content:space-between; gap:8px; padding-top:6px; font-size:clamp(.72rem,.95vw,.95rem); line-height:1.1; }
      .gallery-number { flex:0 0 auto; color:#888; font-size:.72em; }
      .gallery-status { margin:0; color:#888; font-size:.78rem; text-align:center; }
      .gallery-status:empty { display:none; }
      .gallery-status.is-error, .editor-hint.is-error, .render-message.is-error { color:#c4008f; }
      .gallery-footer { min-height:30px; display:flex; justify-content:space-between; align-items:end; gap:14px; padding-top:14px; font-size:.78rem; }
      .gallery-footer a { color:inherit; text-decoration:none; }
      .gallery-footer a:hover { color:var(--pink); }
      .gallery-footer .gallery-source { color:#888; }
      .editor-back,.run-button,.reset-button { padding:4px 8px; border:1px solid var(--ink); background:#fff; color:var(--ink); font:inherit; cursor:pointer; }
      .editor-back:hover,.run-button:hover,.reset-button:hover { background:var(--pink); }
      .run-button:disabled,.reset-button:disabled { opacity:.3; cursor:default; background:#fff; }
      .editor-view { display:none; min-height:100vh; height:100vh; padding:12px 16px 16px; }
      .editor-view.is-open { display:flex; flex-direction:column; }
      .editor-toolbar { min-height:44px; display:flex; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid var(--ink); }
      .editor-title { min-width:0; margin:0; overflow:hidden; font-size:1rem; font-weight:400; text-overflow:ellipsis; white-space:nowrap; }
      .editor-actions { flex:none; display:flex; align-items:center; gap:8px; }
      .editor-back,.run-button,.reset-button { flex:none; white-space:nowrap; }
      .editor-layout { min-height:0; flex:1; display:grid; grid-template-columns:minmax(0,1fr) minmax(320px,.92fr); grid-template-rows:minmax(0,1fr); border:1px solid var(--ink); border-top:0; }
      .code-pane,.render-pane { min-width:0; min-height:0; display:flex; flex-direction:column; }
      .code-pane { border-right:1px solid var(--ink); }
      .pane-label { min-height:36px; display:flex; align-items:center; padding:0 11px; border-bottom:1px solid var(--line); font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; }
      .code-editor-wrap { min-height:0; flex:1; display:grid; grid-template-columns:42px minmax(0,1fr); grid-template-rows:minmax(0,1fr); background:#fbfbfb; overflow:hidden; }
      .line-numbers { overflow:hidden; padding:12px 9px 12px 0; color:#999; background:#f0f0f0; text-align:right; white-space:pre; font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; user-select:none; }
      #code-editor { width:100%; height:100%; min-height:0; resize:none; padding:12px; border:0; outline:0; background:transparent; color:#202020; tab-size:2; white-space:pre; overflow:auto; font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; }
      #code-editor:focus { box-shadow:inset 0 0 0 1px var(--pink); }
      #code-editor:disabled { color:#999; }
      .render-stage { position:relative; min-height:0; flex:1; margin:14px; overflow:hidden; }
      .render-stage iframe { position:absolute; top:0; left:0; width:420px; height:420px; border:0; background:#fff; transform-origin:0 0; opacity:0; }
      .render-stage iframe.is-ready { opacity:1; }
      .render-message { position:absolute; inset:0; z-index:1; display:grid; place-items:center; padding:24px; color:#888; font-size:.78rem; letter-spacing:.04em; text-align:center; white-space:pre-line; }
      .render-message[hidden] { display:none; }
      .editor-hint { min-height:28px; overflow-wrap:anywhere; padding:6px 10px; border-top:1px solid var(--line); color:#777; font-size:.72rem; }
      .editor-open-original { color:#888; font-size:.75rem; text-decoration:none; }
      .editor-open-original:hover { color:#d723aa; }
      @media(max-width:900px) {
        .gallery-view { padding:10px; }
        .gallery-grid { --cols:3; --gap:16px; max-width:640px; padding:24px 12px; align-content:start; }
        .editor-view { height:auto; min-height:100vh; }
        .editor-layout { grid-template-columns:1fr; grid-template-rows:minmax(340px,55vh) min(100vw,70vh); }
        .code-pane { border-right:0; border-bottom:1px solid var(--ink); }
      }
      @media(max-width:560px) {
        .gallery-grid { --cols:2; --gap:12px; padding:16px 8px; }
        .gallery-footer .gallery-source { display:none; }
        .gallery-view { min-height:auto; }
        .editor-view { padding:8px; }
        .editor-toolbar { min-height:40px; gap:8px; }
        .editor-title { font-size:.85rem; }
        .editor-open-original { display:none; }
        .editor-actions { gap:6px; }
      }
      @media(prefers-reduced-motion:reduce) { .gallery-preview,.gallery-preview img { transition:none; } }
    </style>
  </head>
  <body class="p5-gallery-page">
    <main class="gallery-view" id="gallery-view" aria-label="Índice de sketches">
      <p class="gallery-status" id="gallery-status" role="status"></p>
      <section class="gallery-grid" id="gallery-grid" aria-label="Galería de sketches p5"></section>
      <footer class="gallery-footer">
        <a href="index.html">mateo//arce</a>
        <a class="gallery-source" href="https://editor.p5js.org/matbutom/sketches" target="_blank" rel="noreferrer">p5.js/matbutom ↗</a>
      </footer>
    </main>

    <div class="editor-view" id="editor-view" role="region" aria-label="Editor de código p5">
      <header class="editor-toolbar">
        <button class="editor-back" id="editor-back" type="button">← galería</button>
        <h1 class="editor-title" id="editor-title"></h1>
        <div class="editor-actions">
          <a class="editor-open-original" id="editor-open-original" target="_blank" rel="noreferrer">abrir sketch original ↗</a>
          <button class="reset-button" id="reset-button" type="button" disabled>original</button>
          <button class="run-button" id="run-button" type="button" disabled>ejecutar ↗</button>
        </div>
      </header>
      <div class="editor-layout">
        <section class="code-pane" aria-label="Código JavaScript">
          <div class="pane-label" id="code-label">sketch.js</div>
          <div class="code-editor-wrap">
            <div class="line-numbers" id="line-numbers" aria-hidden="true">1</div>
            <textarea id="code-editor" aria-label="Código p5.js" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
          </div>
          <div class="editor-hint" id="editor-status" aria-live="polite"></div>
        </section>
        <section class="render-pane" aria-label="Canvas p5.js">
          <div class="pane-label" id="render-label">canvas</div>
          <div class="render-stage" id="render-stage">
            <p class="render-message" id="render-message" role="status" hidden></p>
          </div>
        </section>
      </div>
    </div>

    <script src="scripts/p5-gallery.js"></script>
  </body>
</html>
